<style>
:root{--blue:#1f6feb;--blue2:#5aa8ff;--navy:#0b2e6b;--sky:#eaf3ff;--bg:#f4f8fe;--card:#fff;--line:#dce7f7;--text:#10233f;--muted:#6a7d98;--ok:#12a150;--warn:#f59e0b;--bad:#e5484d;--violet:#7c3aed;--shadow:0 6px 24px rgba(16,60,140,.08);--ease:cubic-bezier(.3,1.35,.5,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Prompt",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h2{margin:0;font-size:24px;color:var(--navy)}
h3{margin:0 0 10px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px}
p{margin:0}
.muted{color:var(--muted)}
.ic{flex:none;vertical-align:middle}
.icb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--sky);color:var(--blue);flex:none}
.icb.ok{background:#e3f7ea;color:var(--ok)}.icb.warn{background:#fff3d6;color:#b77400}.icb.bad{background:#ffe6e7;color:var(--bad)}.icb.violet{background:#efe6ff;color:var(--violet)}.icb.navy{background:var(--navy);color:#fff}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(31,111,235,.35);flex:none}
.brand b{display:block;font-size:16px;color:var(--navy);letter-spacing:.3px}
.brand small{color:var(--muted);font-size:12px}
.tabs{position:relative;display:flex;gap:2px;margin:0 auto;background:var(--sky);padding:4px;border-radius:14px}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:7px;align-items:center;transition:color .25s;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button.on{color:var(--blue);font-weight:600}
.tabs button .ic{transition:transform .35s var(--ease)}
.tabs button.on .ic{transform:scale(1.15)}

/* ---------- v4: login account type ---------- */

.cell.trial{flex-direction:column}
.seat .nt{font-size:9.5px;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trialchip{background:#fff1cc;color:#7a4b00;border:1px solid #f2c14e}
.trialbtn{margin-top:10px;width:100%;display:flex;gap:10px;align-items:center;border:1.5px dashed #f2c14e;background:#fffaf0;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;transition:all .2s var(--ease)}
.trialbtn:hover{border-style:solid;transform:translateY(-1px)}
.trialbtn.on{border-style:solid;background:#fff4d6}
.trialbtn>span:not(.icb){flex:1;display:flex;flex-direction:column}.trialbtn b{color:#7a4b00}.trialbtn small{font-size:12px;color:#9a6a1a}
/* ---------- v12: ปิดห้องเฉพาะวัน ---------- */
.admtool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px dashed #b9cff0;border-radius:14px;padding:9px 12px;margin-bottom:12px;animation:fadeUp .4s both}
.admtool .grow{flex:1;min-width:220px}.admtool .grow b{color:var(--navy)}.admtool small{display:block;font-size:12px;color:var(--muted)}
.rhead.pick,.rowlab.pick{border:0;background:none;font:inherit;cursor:pointer;border-radius:10px;padding:4px;transition:background .2s,color .2s}
.rhead.pick{color:var(--navy);font-weight:600;font-size:13px;width:100%}
.rowlab.pick{text-align:left;color:var(--muted);padding:4px 0;font-size:12px;line-height:1.15;white-space:nowrap}
.rhead.pick:hover,.rowlab.pick:hover{background:var(--sky);color:var(--blue)}
.seat.x.dc{background:repeating-linear-gradient(45deg,#ffeded 0 6px,#fff 6px 12px);border:2px dashed #f6c4c6;color:#c2474c;flex-direction:column;gap:0;line-height:1.1}
.seat.x.dc[data-act]{cursor:pointer}
.seat.x.dc[data-act]:hover{transform:translateY(-3px);border-color:var(--bad)}
.seat .rs{font-size:9.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.cell.x.dc{background:repeating-linear-gradient(45deg,#ffeded 0 5px,#fff 5px 10px);color:#c2474c}
.cldy{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin:8px 0}
.cldy>b{display:inline-flex;gap:5px;align-items:center;color:var(--navy);min-width:100px}
.cldy>div{display:flex;gap:5px;flex-wrap:wrap;flex:1}
/* ---------- v13: ตั้งสีพื้นหลังชื่อ ---------- */
.swatch{display:grid;place-items:center}
.swatch .ic{opacity:0;transition:opacity .2s}.swatch:hover .ic{opacity:.9}
.cprev{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f7faff;border-radius:14px;padding:12px;justify-content:center}
.cseat{min-width:110px;height:48px;border-radius:14px 14px 8px 8px;display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 10px}
.ccell{min-width:70px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:600;font-size:12px;padding:0 8px}
.cpick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cw{display:flex;gap:10px;align-items:center;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;background:#fff}
.cw input{width:44px;height:36px;border:0;padding:0;background:none;cursor:pointer}
.cw span{display:flex;flex-direction:column;line-height:1.2}.cw b{font-size:13px;color:var(--navy)}.cw small{font-size:11.5px;color:var(--muted)}
/* ---------- v14: จัดลำดับสมาชิก ---------- */
.ord{display:flex;align-items:center;gap:3px}
.grip{cursor:grab;color:#9fb1cc;display:grid;place-items:center;width:22px;height:30px;border-radius:7px;touch-action:none;transition:background .2s,color .2s}
.grip:hover{background:var(--sky);color:var(--blue)}
.ord .no{font-size:12px;font-weight:700;color:var(--muted);min-width:18px;text-align:center}
.ord .ab{display:flex;flex-direction:column;gap:1px}
.ord .ab button{border:0;background:none;color:#9fb1cc;cursor:pointer;width:22px;height:15px;display:grid;place-items:center;border-radius:5px;padding:0}
.ord .ab button:hover:not(:disabled){background:var(--sky);color:var(--blue)}
.ord .ab button:disabled{opacity:.25;cursor:default}
.mrow.dragging{opacity:.35}
.mrow.dropb{box-shadow:inset 0 3px 0 var(--blue)}
.mrow.dropa{box-shadow:inset 0 -3px 0 var(--blue)}
.mrow.ghost{position:fixed;z-index:200;background:#fff;border-radius:12px;box-shadow:0 14px 34px rgba(11,46,107,.25);pointer-events:none;padding:6px 8px;opacity:.95}
.mrow.flash{animation:rowflash 1.2s ease}
@keyframes rowflash{0%{background:#dbeaff}100%{background:transparent}}
/* ---------- v15: ลบสมาชิก ---------- */
.mrow .mst{flex:1}
.mrow>label.mst+.mdel{margin-left:-4px}
.mrow:has(.mdel){grid-template-columns:76px 38px 1.1fr 1.6fr 140px 118px 38px}
.mdel{color:var(--bad);width:34px;height:34px;padding:0}
.mdel:hover{background:#fff1f1}
.deld{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.deld summary{cursor:pointer;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
@media(max-width:700px){.mrow:has(.mdel){grid-template-columns:76px 38px 1fr}.mdel{grid-column:3;justify-self:start}}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;transition:transform .45s var(--ease);z-index:99;max-width:92vw;box-shadow:0 12px 30px rgba(11,46,107,.35);font-weight:500;display:flex;gap:8px;align-items:center}
#toast:not(.show){visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
/* ---------- keyframes ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.75)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes seatIn{from{opacity:0;transform:translateY(10px) scale(.9)}}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 6px rgba(229,72,77,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.top,.tabs,.cart,.demo,.hdact,.btn,.sbtn,.wkslider{display:none!important}main{padding:0}body{background:#fff}.card,.wday,.wk{box-shadow:none}.wrow{flex-wrap:wrap;overflow:visible}}

/* ===== โมชั่นพื้นหลังตามความหมายของแต่ละการ์ด ===== */
.stat{--fx:color-mix(in srgb,var(--ac) 22%,transparent);--fx2:color-mix(in srgb,var(--ac) 12%,transparent)}
/* ชั่วโมง: หน้าปัดนาฬิกา เข็มหมุนช้าๆ */
.stat:has(.icb[data-i=clock])::before{width:58px;height:58px;right:10px;top:50%;margin-top:-29px;border:2px solid var(--fx2);animation:none}
.stat:has(.icb[data-i=clock])::after{width:2px;height:20px;right:38px;bottom:auto;top:50%;margin-top:-20px;border-radius:2px;background:var(--fx);transform-origin:50% 100%;animation:fxSpin 8s linear infinite}
/* Slot: ตั๋ว 2 ใบลอยเอียง */
.stat:has(.icb[data-i=ticket])::before{width:30px;height:18px;right:26px;top:18px;border-radius:5px;border:2px dashed var(--fx);animation:fxTicket 6s ease-in-out infinite}
.stat:has(.icb[data-i=ticket])::after{width:22px;height:14px;right:62px;bottom:16px;border-radius:4px;background:var(--fx2);animation:fxTicket 7s ease-in-out infinite reverse}
/* คน: วงกลมหัว 2 คนขยับสลับกัน */
.stat:has(.icb[data-i=users])::before{width:12px;height:12px;right:42px;top:12px;bottom:auto;border:0;background:var(--fx2);box-shadow:0 15px 0 4px var(--fx2);animation:fxBob 3.6s ease-in-out infinite}
.stat:has(.icb[data-i=users])::after{width:10px;height:10px;right:22px;top:16px;bottom:auto;background:var(--fx);box-shadow:0 13px 0 3px var(--fx2);animation:fxBob 3.6s ease-in-out -1.8s infinite}
/* รอ/นาฬิกาทราย: เม็ดทรายหล่นช้าๆ */
.stat:has(.icb[data-i=hour])::before,.stat:has(.icb[data-i=hour])::after{width:7px;height:7px;top:10px;border:0;background:var(--fx);animation:fxSand 3.2s ease-in infinite}
.stat:has(.icb[data-i=hour])::before{right:34px}.stat:has(.icb[data-i=hour])::after{right:22px;bottom:auto;animation-delay:-1.6s}
/* ปฏิทิน: ตารางวันเล็กๆ ช่องหนึ่งกระพริบเบาๆ */
.stat:has(.icb[data-i=calendar],.icb[data-i=calweek])::before{width:52px;height:40px;right:18px;top:50%;margin-top:-20px;border-radius:7px;border:2px solid var(--fx2);background:repeating-linear-gradient(90deg,transparent 0 11px,var(--fx2) 11px 12px),repeating-linear-gradient(0deg,transparent 0 11px,var(--fx2) 11px 12px);animation:none}
.stat:has(.icb[data-i=calendar],.icb[data-i=calweek])::after{width:9px;height:9px;right:39px;bottom:auto;top:50%;margin-top:-2px;border-radius:2px;background:var(--fx);animation:fxBlink 2.4s ease-in-out infinite}
/* อนุมัติแล้ว: เครื่องหมายถูกลอยขึ้นจางๆ */
.stat:has(.icb[data-i=checkc])::before{width:16px;height:9px;right:30px;top:auto;bottom:18px;border:0;border-left:3px solid var(--fx);border-bottom:3px solid var(--fx);border-radius:0;transform:rotate(-45deg);animation:fxRise 3.4s ease-out infinite}
.stat:has(.icb[data-i=checkc])::after{display:none}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxTicket{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-5px,-6px) rotate(6deg)}}
@keyframes fxBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fxSand{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes fxBlink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fxRise{0%{transform:translateY(8px) rotate(-45deg);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) rotate(-45deg);opacity:0}}
@media(max-width:860px){.stat:has(.icb[data-i])::after{display:block}.stat:has(.icb[data-i])::before,.stat:has(.icb[data-i])::after{opacity:.75}
  .stat:has(.icb[data-i=clock])::before{width:40px;height:40px;right:8px;top:8px;margin-top:0}.stat:has(.icb[data-i=clock])::after{height:14px;right:27px;top:14px;margin-top:0}
  .stat:has(.icb[data-i=calendar],.icb[data-i=calweek])::before{width:38px;height:28px;right:8px;top:8px;margin-top:0}.stat:has(.icb[data-i=calendar],.icb[data-i=calweek])::after{width:7px;height:7px;right:23px;top:19px;margin-top:0}
  .stat:has(.icb[data-i=ticket])::before{right:10px;top:8px;scale:.8}.stat:has(.icb[data-i=ticket])::after{display:none}
  .stat:has(.icb[data-i=users])::before{right:30px;top:8px}.stat:has(.icb[data-i=users])::after{right:12px;top:11px}
  .stat:has(.icb[data-i=hour])::before{right:22px;top:6px}.stat:has(.icb[data-i=hour])::after{right:12px;top:6px}}
@media(prefers-reduced-motion:reduce){.stat::before,.stat::after{animation:none!important}}

.stat:has(.icb[data-i=x])::before,.stat:has(.icb[data-i=x])::after{width:30px;height:3px;right:26px;top:50%;margin-top:-2px;border:0;border-radius:3px;background:var(--fx);animation:fxStamp 4s ease-in-out infinite}

.stat:has(.icb[data-i=history])::after{width:0;height:0;right:56px;bottom:auto;top:50%;margin-top:-16px;border-radius:0;background:none;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--fx);animation:fxNudgeL 6s ease-in-out infinite}

.stat:has(.icb[data-i=mic])::after{bottom:auto;animation-delay:-1.3s}

function payData(from,to,cols){
  const rows={},pend={};
  for(const v of Object.values(S.d.slots)){if(v.date<from||v.date>to)continue;
    if(isTrial(v)){rows.__t=(rows.__t||0)+C().hours;continue}
    if(v.status==='pending'){pend[v.who]=(pend[v.who]||0)+C().hours;continue}
    const r=rows[v.who]||(rows[v.who]={cols:cols.map(()=>0),tot:0,n:0,short:0});const ci=cols.findIndex(c=>v.date>=c.from&&v.date<=c.to),hh=hrsOf(v);
    if(ci>=0)r.cols[ci]+=hh;r.tot+=hh;r.n++;if(isShort(v))r.short++}
  return{rows,pend};
}

   <div class="logs2">${rows||'<p class="muted" style="padding:14px 0">ไม่พบประวัติตามเงื่อนไขนี้</p>'}</div>

function moveMemberTo(id,beforeId){const ids=orderIds().filter(x=>x!==id);const k=beforeId?ids.indexOf(beforeId):ids.length;ids.splice(k<0?ids.length:k,0,id);S._flash=id;saveOrder(ids,`ย้าย ${M(id).name} ไปลำดับ ${ids.indexOf(id)+1}`).then(flashRow)}

/* ลากด้วยเมาส์หรือนิ้ว (pointer) */
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g)return;e.preventDefault();
  const id=g.dataset.grip,row=g.closest('.mrow'),list=[...document.querySelectorAll('.mrow[data-mid]')];row.classList.add('dragging');
  let target=null,after=false;const ghost=row.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=row.offsetWidth+'px';document.body.appendChild(ghost);
  const place=y=>{ghost.style.top=(y-20)+'px';ghost.style.left=row.getBoundingClientRect().left+'px'};place(e.clientY);
  const mv=ev=>{place(ev.clientY);list.forEach(r=>r.classList.remove('dropb','dropa'));target=null;
    for(const r of list){if(r===row)continue;const bb=r.getBoundingClientRect();if(ev.clientY>=bb.top&&ev.clientY<=bb.bottom){after=ev.clientY>bb.top+bb.height/2;target=r;r.classList.add(after?'dropa':'dropb');break}}
    if(ev.clientY<60)window.scrollBy(0,-12);if(ev.clientY>innerHeight-60)window.scrollBy(0,12)};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);ghost.remove();row.classList.remove('dragging');list.forEach(r=>r.classList.remove('dropb','dropa'));
    if(target){const ids=list.map(r=>r.dataset.mid).filter(x=>x!==id),ti=ids.indexOf(target.dataset.mid);moveMemberTo(id,after?(ids[ti+1]||null):ids[ti])}};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
});

function ticketDlg(k){

async function doBook(){
  const keys=[...S.sel].sort(),ops=[],errs=[],taken=new Set(),st=C().perms.autoConfirm?'ok':'pending';
  for(const k of keys){const p=parseSid(k),t=p.d+'_'+p.s;
    if(S.d.slots[k]){errs.push(`${fmtD(p.d)} ${C().slots[p.s]} ห้อง ${p.r}: มีคนจองไปแล้ว`);continue}
    if(isPast(p.d,p.s)){errs.push(`${fmtD(p.d)} ${C().slots[p.s]}: เลยเวลาแล้ว`);continue}
    if(!canBookDate(p.d)){errs.push(`${fmtD(p.d)}: ยังไม่เปิดให้จอง`);continue}
    if(isClosed(p.d,p.r,p.s)){errs.push(`${fmtD(p.d)} ${C().slots[p.s]} ห้อง ${p.r}: ห้องปิด`);continue}
    if(taken.has(t)||ROOMS().some(r=>slotOf(p.d,r,p.s)?.who===S.meId)){errs.push(`${fmtD(p.d)} ${C().slots[p.s]}: คุณมีคิวเวลานี้แล้ว`);continue}
    taken.add(t);const id=rid()+ops.length;
    ops.push(['set','slots',k,{date:p.d,room:p.r,slot:p.s,who:S.meId,status:st,at:Date.now(),reqAt:Date.now(),by:S.meId,...(st==='pending'?{reqId:id}:{})}]);

   ${errs.length?`<div class="req" style="margin-top:12px;border-color:#f6c4c6"><div class="info"><b style="color:var(--bad)">${ic('alert',15)}จองไม่ได้ ${errs.length} รายการ</b>${errs.map(e=>`<div style="font-size:13px">• ${esc(e)}</div>`).join('')}</div></div>`:''}
   <div class="mact"><button class="btn primary" data-d="close">ตกลง</button></div>`,()=>closeM());
}

    P.ids.forEach(id=>t+=`"${M(id).name}",${EMP[empOf(id)]||''},${P.rows[id].cols.map(fmtH).join(',')},${fmtH(P.rows[id].tot)},${P.rows[id].n}\n`);
    if(P.shorts?.length){t+=`\nSlot ที่ไลฟ์ไม่ครบ\nชื่อ,วันที่,เวลา,ห้อง,ชั่วโมงจริง,เหตุผล,บันทึกโดย\n`;P.shorts.forEach(([k,v])=>{const p=parseSid(k);t+=`"${M(v.who).name}",${p.d},${C().slots[p.s]},${p.r},${fmtH(hrsOf(v))},"${(v.actReason||'').replace(/"/g,'""')}","${(v.actBy||'').replace(/"/g,'""')}"\n`})}
    t+='\nรายละเอียดรายคิว\nวันที่,เวลา,ห้อง,ชื่อ,สถานะ\n';Object.values(S.d.slots).filter(v=>v.date>=P.from&&v.date<=P.to).sort((a,b)=>(a.date+a.slot+a.room).localeCompare(b.date+b.slot+b.room)).forEach(v=>t+=`${v.date},${C().slots[v.slot]},${v.room},"${whoName(v)}",${STATUS[v.status]}\n`);
    download(`สรุปชั่วโมง-${P.from}_${P.to}.csv`,t,'text/csv')},
};

/* ---------- ปัดแถบวันที่ซ้าย/ขวา เพื่อเปลี่ยนสัปดาห์ ---------- */
(()=>{let G=null,blockClick=0;const SEL='.dstrip,.daytabs';
  document.addEventListener('pointerdown',e=>{const el=e.target.closest(SEL);if(!el||(e.pointerType==='mouse'&&e.button!==0))return;G={el,x:e.clientX,y:e.clientY,id:e.pointerId,mv:0}},{passive:true});
  document.addEventListener('pointermove',e=>{if(!G||e.pointerId!==G.id)return;const dx=e.clientX-G.x,dy=e.clientY-G.y;
    if(!G.mv&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2)G.mv=1;
    if(G.mv){G.el.style.transition='none';G.el.style.transform=`translateX(${Math.max(-90,Math.min(90,dx*.45))}px)`;G.el.style.opacity=String(1-Math.min(.35,Math.abs(dx)/500))}},{passive:true});
  const end=e=>{if(!G||e.pointerId!==G.id)return;const g=G;G=null;const dx=e.clientX-g.x,dy=e.clientY-g.y;
    g.el.style.transition='transform .25s var(--ease),opacity .25s';g.el.style.transform='';g.el.style.opacity='';
    if(!g.mv||e.type==='pointercancel'&&Math.abs(dx)<50)return;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){blockClick=Date.now();const n=dx<0?1:-1,isCal=g.el.classList.contains('daytabs');
      acts[isCal?'weekJump':'wk']({dataset:{n}});
      requestAnimationFrame(()=>{const ne=document.querySelector(isCal?'.daytabs':'.dstrip');if(ne){ne.classList.remove('swl','swr');void ne.offsetWidth;ne.classList.add(n>0?'swl':'swr')}})}};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',e=>{if(Date.now()-blockClick<350&&e.target.closest(SEL)){e.stopPropagation();e.preventDefault()}},true);
})();
(()=>{const set=()=>{const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--hh',t.offsetHeight+'px')};addEventListener('resize',set);setInterval(set,1500);setTimeout(set,300)})();
document.addEventListener('input',e=>{const t=e.target;if(t.dataset?.mq){const q=t.value.trim().toLowerCase();document.querySelectorAll('.tmrow').forEach(r=>r.style.display=!q||r.dataset.q.includes(q)?'':'none')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.closest('dialog'))return;const f=acts[b.dataset.act];if(f){if(!(b.tagName==='INPUT'&&b.type==='checkbox'))e.preventDefault();f(b)}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();
  if(!okEmail($('#lemail')?.value)){toast('กรอกอีเมลให้ถูกต้องก่อน',1);$('#lemail')?.focus();return}
  S.store.login('email')}});
document.addEventListener('input',e=>{if(e.target.id!=='lemail')return;S.lemail=e.target.value;const ok=okEmail(e.target.value),b=$('#lgo'),n=$('#lnote');
  if(b)b.disabled=!ok;if(n)n.textContent=ok?'':'กรอกอีเมลให้ถูกต้องก่อน แล้วกด “เข้าสู่ระบบ”';e.target.closest('.field')?.classList.toggle('bad',!!e.target.value&&!ok)});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.perm!==undefined)return saveCfg({perms:{...C().perms,[t.dataset.perm]:t.checked}},`${t.checked?'เปิด':'ปิด'}สิทธิ์: ${PERM_INFO.find(x=>x[0]===t.dataset.perm)[2]}`);
  if(t.dataset.permnum)return saveCfg({perms:{...C().perms,[t.dataset.permnum]:+t.value||0}},`ตั้งยกเลิกล่วงหน้า ${t.value} ชม.`);
  if(t.dataset.cfgnum){const v=+t.value;if(!(v>0))return render();if((t.dataset.cfgnum==='rooms'?Math.min(12,Math.round(v)):v)===C()[t.dataset.cfgnum])return;return saveCfg({[t.dataset.cfgnum]:t.dataset.cfgnum==='rooms'?Math.min(12,Math.round(v)):v},`${t.dataset.cfgnum==='rooms'?'ตั้งจำนวนห้องไลฟ์':'ตั้งชั่วโมงต่อรอบ'}: ${C()[t.dataset.cfgnum]} → ${t.dataset.cfgnum==='rooms'?Math.min(12,Math.round(v))+' ห้อง':v+' ชม.'}`)}
  if(t.dataset.memp!==undefined){const v=t.value||null;write([['patch','members',t.dataset.memp,{emp:v}]],`ตั้ง ${M(t.dataset.memp).name} เป็นพนักงาน ${v?EMP[v]:'ไม่ระบุ'}`);return}
  if(t.dataset.mname){const n=t.value.trim();if(n)n!==M(t.dataset.mname).name&&write([['patch','members',t.dataset.mname,{name:n}]],`เปลี่ยนชื่อ Live Streamer: ${M(t.dataset.mname).name} → ${n}`);return}
  if(t.dataset.memail!==undefined&&t.dataset.memail)return saveEmail(t.dataset.memail,t.value);
  if(t.dataset.mrole&&!isOwnerMe()&&t.value==='brand'){toast('ให้สิทธิ์แบรนด์ได้เฉพาะเจ้าของระบบ',1);render();return}
  if(t.dataset.mrole){const em=Object.entries(S.d.access).find(([,a])=>a.memberId===t.dataset.mrole)?.[0];if(em)write([['patch','access',em,{role:t.value}]],`ตั้งสิทธิ์ ${M(t.dataset.mrole).name} = ${ROLE_L[t.value]}`);return}
  if(t.dataset.mactive)return toggleActive(t.dataset.mactive,t.checked);
  if(t.dataset.focus){S.focus=t.value||null;render();return}
  if(t.dataset.booklimit){if(t.checked&&!(C().bookWindows||[]).length)toast('อย่าลืมเพิ่มรอบเปิดจองด้านล่าง ไม่งั้น Live Streamer จะจองไม่ได้เลย',1);return saveCfg({bookLimit:t.checked},t.checked?'เปิดการจำกัดวันจอง: Live Streamer จองได้เฉพาะรอบเปิดจอง':'ปิดการจำกัดวันจอง (รอบเปิดจอง): Live Streamer จองได้ทุกวัน')}
  if(t.dataset.logby){S.logBy=t.value||null;render();return}
  if(t.dataset.logq!==undefined){S.logQ=t.value;render();return}
  if(t.dataset.wdate){wSum();return}
  if(t.dataset.payd){S['pay'+(t.dataset.payd==='from'?'From':'To')]=t.value||null;render();return}
  if(t.dataset.paywin){S.payWin=t.value;render();return}
  if(t.dataset.rqd){S.rqF={...(S.rqF||{}),[t.dataset.rqd]:t.value||null};const q=S.rqF;if(q.from&&q.to&&q.to<q.from)[q.from,q.to]=[q.to,q.from];render();return}
  if(t.dataset.reqby){S.reqBy=t.value||null;render();return}
  if((t.dataset.aname||t.dataset.aactive)&&(!ownerOnly()||isOwnerEmail(t.dataset.aname||t.dataset.aactive)))return;
  if(t.dataset.aname){const n=t.value.trim();if(n)n!==(S.d.access[t.dataset.aname]?.name||'')&&write([['patch','access',t.dataset.aname,{name:n}]],`เปลี่ยนชื่อ Admin: ${S.d.access[t.dataset.aname]?.name||t.dataset.aname} → ${n}`);return}
  if(t.dataset.aactive){write([['patch','access',t.dataset.aactive,{active:t.checked}]],`${t.checked?'เปิด':'ระงับ'}การใช้งาน Admin ${S.d.access[t.dataset.aactive]?.name||t.dataset.aactive}`);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='noteIn')$('#dlg [data-d=save]')?.click()});

   BOOT
   ===================================================================== */
(async()=>{
  try{S.store=FIREBASE_CONFIG?await makeFirebase(FIREBASE_CONFIG):makeLocal()}
  catch(e){console.error(e);toast('เชื่อมต่อ Firebase ไม่ได้ → ใช้โหมดทดลอง',1);S.store=makeLocal()}
  S.d=S.store.data;
  if(S.store.demo)S.booting=false;
  if(!isOpen(S.date))acts.today();
  S.store.start(()=>{S.d=S.store.data;render()});
})();
</script>
